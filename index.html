<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" />
    <title>Music of Life</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script defer src="./app.js"></script>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body style="background:#000">
    <div id="root"></div>
    <!-- If this source page is opened directly (double-click, or served as-is), the app can't load:
         say how to run it instead of showing a blank screen. Does nothing once the app has mounted. -->
    <script>
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<div style="font:14px/1.6 Barlow,Helvetica,Arial,sans-serif;color:#9a9a9a;padding:32px;max-width:520px;text-transform:uppercase;letter-spacing:.06em">' +
            '<p style="color:#fff">Music of Life</p>' +
            '<p>This is the source page. Run <span style="color:#fff">npm install</span> then <span style="color:#fff">npm run dev</span>, ' +
            'or <span style="color:#fff">npm run build</span> and open <span style="color:#fff">dist/index.html</span>.</p></div>';
        }
      }, 1500);
    </script>
  </body>
</html>
